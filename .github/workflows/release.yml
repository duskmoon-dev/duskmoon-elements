name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0, 1.0.0, patch, minor, major)'
        required: true
        type: string
      dry-run:
        description: 'Dry run (do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Do not set registry-url: it writes _authToken=${NODE_AUTH_TOKEN}
          # into NPM_CONFIG_USERCONFIG and blocks OIDC trusted publishing.
          node-version: '24'

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          # Pin a known-good OIDC-capable CLI (11.5.1+). Avoid relying on whatever
          # ships with the runner / latest major if it regresses.
          npm install -g npm@11.6.2
          npm --version
          node --version

          # Any leftover token auth (empty or not) short-circuits the OIDC path.
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" || true

          echo "OIDC env present: ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC env present: ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          ls -la "$HOME/.npmrc" 2>/dev/null || echo "No ~/.npmrc (good for OIDC)"

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          # Get current version from core package
          CURRENT_VERSION=$(jq -r '.version' packages/base/package.json)

          # Parse current version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$INPUT_VERSION" in
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            *)
              # Assume it's a specific version
              NEW_VERSION="$INPUT_VERSION"
              ;;
          esac

          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION"

      - name: Update package versions
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # Helper: update .version and synchronize internal package dependencies.
          # Match by package name rather than current value so a previous release's
          # exact version pins cannot become stale on later releases.
          update_pkg() {
            local file="$1"
            jq --arg v "$NEW_VERSION" '
              reduce [
                "dependencies",
                "devDependencies",
                "peerDependencies",
                "optionalDependencies"
              ][] as $field (
                .version = $v;
                if .[$field] then
                  .[$field] |= with_entries(
                    if (.key | test("^@duskmoon-dev/(el-|elements$|art-elements$)")) then
                      .value = $v
                    else
                      .
                    end
                  )
                else
                  .
                end
              )
            ' "$file" > tmp.json && mv tmp.json "$file"
            echo "Updated $file to $NEW_VERSION"
          }

          # Update core and bundle packages
          for pkg in packages/base packages/elements; do
            update_pkg "$pkg/package.json"
          done

          # Update all element packages
          for pkg in elements/*; do
            if [ -f "$pkg/package.json" ]; then
              update_pkg "$pkg/package.json"
            fi
          done

          # Update all CSS art packages
          for pkg in art-elements/*; do
            if [ -f "$pkg/package.json" ]; then
              update_pkg "$pkg/package.json"
            fi
          done

          # Update CSS arts bundle
          update_pkg packages/art-elements/package.json

      - name: Build all packages
        run: bun run build:all

      - name: Publish packages (dry-run)
        if: ${{ inputs.dry-run }}
        run: bun run release:dry-run

      - name: Publish packages
        if: ${{ !inputs.dry-run }}
        env:
          # Prefer OIDC trusted publishing; never inject NODE_AUTH_TOKEN / NPM_TOKEN.
          NPM_CONFIG_PROVENANCE: true
        run: |
          # Bulletproof: strip token auth so npm CLI initiates the OIDC exchange.
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" || true

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC env vars missing. Ensure permissions.id-token: write is set."
            exit 1
          fi

          publish_one() {
            local dir="$1"
            local name="$2"
            local version="$3"
            echo "Publishing $name@$version..."
            (
              cd "$dir"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "  $name@$version already published, skipping"
                exit 0
              fi
              # env -u keeps child npm free of empty token placeholders.
              if ! env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NPM_CONFIG_USERCONFIG \
                npm publish --access public --provenance --loglevel=verbose \
                --registry=https://registry.npmjs.org/; then
                echo "::error::npm publish failed for $name@$version"
                echo "--- npm debug log (tail) ---"
                ls -1t "$HOME/.npm/_logs"/*-debug-*.log 2>/dev/null | head -1 | xargs -I{} sh -c 'grep -nE "oidc|OIDC|auth|ENEEDAUTH|404|trusted" {} | tail -80 || tail -80 {}'
                exit 1
              fi
            )
          }

          NEW_VERSION="${{ steps.version.outputs.new }}"

          publish_one packages/base "@duskmoon-dev/el-base" "$NEW_VERSION"

          for pkg in elements/*; do
            if [ -f "$pkg/package.json" ]; then
              publish_one "$pkg" "$(jq -r '.name' "$pkg/package.json")" "$NEW_VERSION"
            fi
          done

          for pkg in art-elements/*; do
            if [ -f "$pkg/package.json" ]; then
              publish_one "$pkg" "$(jq -r '.name' "$pkg/package.json")" "$NEW_VERSION"
            fi
          done

          publish_one packages/elements "@duskmoon-dev/elements" "$NEW_VERSION"
          publish_one packages/art-elements "@duskmoon-dev/art-elements" "$NEW_VERSION"

          echo "All packages published!"

      - name: Commit version bump
        if: ${{ !inputs.dry-run }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          git add -A

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit (version already at $NEW_VERSION)"
          else
            git commit -m "chore(release): v$NEW_VERSION"
          fi

          # Only create tag if it doesn't exist
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists, skipping"
          else
            git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          fi

          git push origin main --follow-tags || true

      - name: Generate package list
        id: packages
        run: |
          # Build element packages list for release notes
          ELEMENTS=""
          for pkg in elements/*; do
            if [ -f "$pkg/package.json" ]; then
              FULL_PKG_NAME=$(jq -r '.name' "$pkg/package.json")
              ELEMENTS="$ELEMENTS- $FULL_PKG_NAME\n"
            fi
          done
          echo "elements<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ELEMENTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Build CSS art packages list for release notes
          CSS_ARTS=""
          for pkg in art-elements/*; do
            if [ -f "$pkg/package.json" ]; then
              FULL_PKG_NAME=$(jq -r '.name' "$pkg/package.json")
              CSS_ARTS="$CSS_ARTS- $FULL_PKG_NAME\n"
            fi
          done
          echo "css_arts<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CSS_ARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Published Packages

            **Core:**
            - @duskmoon-dev/el-base - Base element class with reactive properties, Shadow DOM, and theming utilities

            **Elements:**
            ${{ steps.packages.outputs.elements }}
            **Bundles:**
            - @duskmoon-dev/elements - All DuskMoon elements in one bundle with auto-registration support
            - @duskmoon-dev/art-elements - All CSS art elements in one bundle

            **CSS Art Elements:**
            ${{ steps.packages.outputs.css_arts }}
            ## Installation

            ```bash
            # Install the elements bundle
            bun add @duskmoon-dev/elements

            # Install the CSS art bundle
            bun add @duskmoon-dev/art-elements

            # Or install individual packages
            bun add @duskmoon-dev/el-button
            bun add @duskmoon-dev/el-art-moon
            ```

            ## What's Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.version.outputs.new }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run**: ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Core:**" >> $GITHUB_STEP_SUMMARY
          echo "- @duskmoon-dev/el-base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Elements:**" >> $GITHUB_STEP_SUMMARY
          for pkg in elements/*; do
            if [ -f "$pkg/package.json" ]; then
              FULL_PKG_NAME=$(jq -r '.name' "$pkg/package.json")
              echo "- $FULL_PKG_NAME" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CSS Art Elements:**" >> $GITHUB_STEP_SUMMARY
          for pkg in art-elements/*; do
            if [ -f "$pkg/package.json" ]; then
              FULL_PKG_NAME=$(jq -r '.name' "$pkg/package.json")
              echo "- $FULL_PKG_NAME" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bundles:**" >> $GITHUB_STEP_SUMMARY
          echo "- @duskmoon-dev/elements" >> $GITHUB_STEP_SUMMARY
          echo "- @duskmoon-dev/art-elements" >> $GITHUB_STEP_SUMMARY
