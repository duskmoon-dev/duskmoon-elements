<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stat - DuskMoon Elements Playground</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .demo-card {
        min-width: 14rem;
        min-height: 6rem;
        padding: 1rem;
        background: var(--color-surface-container);
        border-radius: var(--radius-md);
      }
    </style>
  </head>
  <body>
    <!--#include file="partials/header.html" -->
    <main class="container">
      <h1>Stat</h1>
      <section class="demo-section">
        <h2>Basic usage</h2>
        <div class="demo-box">
          <el-dm-stat color="success"
            ><span slot="title">Successful requests</span><strong slot="value">98.4%</strong
            ><span slot="description">Last 24 hours</span></el-dm-stat
          >
        </div>
      </section>
    </main>
    <script type="module">
      import '@duskmoon-dev/el-stat/register';
    </script>
  </body>
</html>
