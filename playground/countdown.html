<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown - DuskMoon Elements Playground</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .demo-card {
        min-width: 14rem;
        min-height: 6rem;
        padding: 1rem;
        background: var(--color-surface-container);
        border-radius: var(--radius-md);
      }
    </style>

    <script type="module">
      import '@duskmoon-dev/el-countdown/register';
