<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading - DuskMoon Elements Playground</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .demo-card {
        min-width: 14rem;
        min-height: 6rem;
        padding: 1rem;
        background: var(--color-surface-container);
        border-radius: var(--radius-md);
      }
    </style>
  </head>
  <body>
    <!--#include file="partials/header.html" -->
    <main class="container">
      <h1>Loading</h1>
      <section class="demo-section">
        <h2>Basic usage</h2>
        <div class="demo-box">
          <el-dm-loading
            shape="spinner"
            size="lg"
            color="primary"
            role="status"
            aria-label="Loading"
          ></el-dm-loading>
          <el-dm-loading shape="dots" size="lg" aria-hidden="true"></el-dm-loading>
          <el-dm-loading
            shape="bars"
            size="lg"
            color="secondary"
            aria-hidden="true"
          ></el-dm-loading>
        </div>
      </section>
    </main>
    <script type="module">
      import '@duskmoon-dev/el-loading/register';
    </script>
  </body>
</html>
