<!doctype html>
<html lang="en">
  <head>
    {{> head}}
  </head>
  <body>
    {{> nav}} {{> page-header}}
    <section>
      <h2>Agent conversation</h2>
      <p>
        Unboxed answers, work disclosures, collapsible user messages, and a waiting queue above the
        composer.
      </p>

      <div class="chat-design-demo" style="display: grid; gap: 0.75rem; width: min(100%, 42rem)">
        <el-dm-chat-scroll label="Agent design example" style="height: 26rem">
          <el-dm-chat
            align="end"
            color="primary"
            collapsible
            content="Review the current chat design.
Keep agent answers outside message bubbles.
Group tool activity in a work disclosure.
Keep the waiting queue above the composer.
Steer messages into the current conversation.
Preserve multiline drafts and attachments.
Keep keyboard controls accessible.
Check the layout on narrow screens."
          ></el-dm-chat>
          <el-dm-chat
            agent
            timeline="1"
            author="Assistant"
            content="The answer stays visible while you inspect the **work record**. Steer a waiting message to add it to this conversation."
          >
            <el-dm-chat-work slot="work" summary="Worked · 2 checks">
              <el-dm-chat-reasoning summary="Checked the design">
                Reviewed the message layout, queue tray, and composer controls.
              </el-dm-chat-reasoning>
              <el-dm-chat-tool name="design-check" status="success">
                <span slot="result">Agent content and activity use DuskMoonUI styles.</span>
              </el-dm-chat-tool>
            </el-dm-chat-work>
          </el-dm-chat>
        </el-dm-chat-scroll>
        <el-dm-chat-input
          busy
          color="ghost"
          auto-grow
          clear-on-send
          placeholder="Message the agent…"
        >
          <el-dm-chat-queue slot="queue" label="Waiting messages"></el-dm-chat-queue>
        </el-dm-chat-input>
        <div>
          <el-dm-button data-complete variant="text">Complete reply</el-dm-button>
          <p data-status role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>
    </section>
    <script type="module" src="./chat.ts"></script>
  </body>
</html>
